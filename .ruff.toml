# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py313"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "CPY001", # Missing copyright notice (this project does not use per-file notices)
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
# Disable rules that are not applicable to test files
"tests/**/*.py" = [
    "S101",   # Use of `assert` detected (assert is normal in tests)
    "PLR2004", # Magic value used in comparison (magic values are normal in tests)
    "SLF001", # Private member accessed (accessing private members is normal in tests)
    "ARG002", # Unused method argument (pytest fixtures are dependency-injected)
]
# pcap_captures/ is protocol reference material and a standalone interactive
# debug tool, not part of the shipped integration -- the Google-docstring and
# print()-avoidance conventions that apply to custom_components/ don't fit an
# interactive CLI's small per-menu-item handlers.
"pcap_captures/**/*.py" = [
    "T201",   # `print` used (this is a terminal UI, not a library)
    "D103",   # Missing docstring in public function (menu handlers are self-describing)
    "D401",   # First line of docstring should be in imperative mood
    "D213",   # Multi-line docstring summary should start at the second line
    "D413",   # Missing blank line after last section
    "PLW0603", # global statement used to set NUM_CHANNELS from a one-time startup
               # prompt in this single-threaded CLI script; a state container class
               # would be pure ceremony for a debug tool with one mutable setting
]
